<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlanSM Contract Signature</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{font-family:Inter,Arial,sans-serif;background:#f8fafc}#signature-pad{border:2px dashed #cbd5e1;border-radius:12px;background:white;cursor:crosshair;touch-action:none}.contract-scroll{max-height:560px;overflow-y:auto}@media print{.no-print{display:none!important}.contract-scroll{max-height:none;overflow:visible}body{background:white}}
    /* hidden iframe used for form fallback */
    #postFallbackFrame { display: none; width:0; height:0; border:0; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-10 text-slate-800">
  <!-- Loading / error / app containers (kept structure and IDs so your existing CSS/logic still works) -->
  <div id="loadingBox" class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Loading contract...</h1>
    <p class="text-sm text-slate-500">Please wait while we prepare the secure signature page.</p>
  </div>

  <div id="errorBox" class="hidden max-w-4xl mx-auto bg-white rounded-2xl shadow-xl p-8 border border-red-100">
    <h1 class="text-2xl font-bold text-red-700 mb-2">Unable to load contract</h1>
    <p id="errorText" class="text-sm text-slate-600"></p>
  </div>

  <div id="app" class="hidden max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
    <!-- Top header -->
    <div class="p-6 border-b bg-gradient-to-r from-sky-50 to-white">
      <div class="flex items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center border">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <path d="M4 12h16" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 6h16" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 18h16" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div>
            <div id="contract-title" class="text-lg font-bold text-slate-900">Contract</div>
            <div id="contract-sub" class="text-xs text-slate-500">Please review and sign</div>
          </div>
        </div>
        <div>
          <span id="status-pill" class="bg-yellow-50 text-yellow-600 text-xs font-bold px-3 py-1 rounded-full border border-yellow-200">Pending</span>
        </div>
      </div>
    </div>

    <div class="p-6 grid md:grid-cols-2 gap-6">
      <!-- Left column: contract -->
      <div>
        <div class="contract-scroll bg-white p-4 rounded-lg border">
          <div id="contract-html">
            <!-- Inserted contract HTML will go here by your existing load() logic -->
            <p class="text-sm text-slate-600">Contract content will appear here.</p>
          </div>
        </div>
      </div>

      <!-- Right column: signature form -->
      <div class="space-y-4">
        <form id="signature-form" class="space-y-4 no-print">
          <div>
            <label class="block text-xs text-slate-500">Full name</label>
            <input id="signer-name" class="w-full mt-1 p-2 border rounded" type="text" placeholder="Full name" required />
          </div>

          <div>
            <label class="block text-xs text-slate-500">Email</label>
            <input id="signer-email" class="w-full mt-1 p-2 border rounded" type="email" placeholder="you@example.com" required />
          </div>

          <div>
            <label class="block text-xs text-slate-500">Legal name (company / person)</label>
            <input id="clientLegalNameInput" class="w-full mt-1 p-2 border rounded" type="text" placeholder="Legal name" required />
          </div>

          <div>
            <label class="block text-xs text-slate-500">Signature</label>
            <div id="signature-pad" class="mt-2" style="width:100%;height:180px;">
              <canvas id="signatureCanvas" style="width:100%;height:100%;display:block;border-radius:8px"></canvas>
            </div>
            <div class="flex gap-2 mt-2">
              <button type="button" id="clear-signature" class="px-3 py-2 bg-white border rounded">Clear</button>
            </div>
          </div>

          <div>
            <button id="submit-btn" type="submit" class="w-full px-4 py-3 bg-sky-600 text-white rounded font-semibold">Sign Documents</button>
          </div>

          <div id="status-message" class="text-sm text-slate-600 hidden"></div>
        </form>

        <div class="text-xs text-slate-400">
          By signing you agree to the terms of this contract.
        </div>
      </div>
    </div>

    <div class="p-6 border-t text-xs text-slate-500">
      <div>Need help? Contact your account manager.</div>
    </div>
  </div>

  <!-- Invisible iframe for form fallback -->
  <iframe id="postFallbackFrame" name="postFallbackFrame" aria-hidden="true"></iframe>

<script>
/* ---------- CONFIG ---------- */
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyxacLewbU1IFLh1cmzZ1i0TNlKkCn6gGBb-qSEXzDfBUUjKZW7ksFuZqUJYZicsf6k/exec";

/* ---------- Small helper utilities ---------- */
function qs(sel, root = document) { return root.querySelector(sel); }
function qsa(sel, root = document) { return Array.from((root || document).querySelectorAll(sel)); }
function show(el){ if(!el) return; el.classList.remove('hidden'); }
function hide(el){ if(!el) return; el.classList.add('hidden'); }

/* Simple URL params helper */
function getParams() { return new URLSearchParams(location.search); }

/* JSONP helper for cross-origin GET requests (Apps Script JSONP endpoints) */
function jsonp(action, params = {}, timeout = 20000) {
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const url = new URL(BACKEND_URL);
    url.searchParams.set('action', action);
    Object.keys(params).forEach(k => url.searchParams.set(k, params[k] === undefined ? '' : params[k]));
    url.searchParams.set('callback', cb);
    const script = document.createElement('script');
    let timer = setTimeout(() => {
      cleanup();
      reject(new Error('Timeout'));
    }, timeout);
    function cleanup() {
      clearTimeout(timer);
      try { delete window[cb]; } catch(e){}
      script.remove();
    }
    window[cb] = (data) => { cleanup(); resolve(data); };
    script.onerror = () => { cleanup(); reject(new Error('Network error')); };
    script.src = url.toString();
    document.body.appendChild(script);
  });
}

/* Status / UI messaging */
function setStatus(msg, type = 'info') {
  const s = qs('#status-message');
  const pill = qs('#status-pill');
  if (s) { s.textContent = msg; s.classList.remove('hidden'); }
  if (pill) {
    pill.className = type === 'success' ? 'bg-green-500/20 text-green-300 text-xs font-bold px-3 py-1 rounded-full border border-green-500/30'
      : type === 'error' ? 'bg-red-50 text-red-600 text-xs font-bold px-3 py-1 rounded-full border border-red-100'
      : 'bg-yellow-50 text-yellow-600 text-xs font-bold px-3 py-1 rounded-full border border-yellow-200';
    pill.textContent = type === 'success' ? 'Signed' : type === 'error' ? 'Error' : 'Pending';
  }
}

/* ---------- Signature canvas handling (kept minimal and compatible) ---------- */
const canvas = qs('#signatureCanvas');
const ctx = canvas && canvas.getContext ? canvas.getContext('2d') : null;
let drawing = false;

function resizeCanvas() {
  if (!canvas || !ctx) return;
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#0f172a';
  ctx.fillStyle = '#fff';
  ctx.fillRect(0,0,rect.width,rect.height);
}
function getPointer(e) {
  const r = canvas.getBoundingClientRect();
  const touch = e.touches && e.touches[0];
  const x = touch ? touch.clientX : e.clientX;
  const y = touch ? touch.clientY : e.clientY;
  return { x: x - r.left, y: y - r.top };
}
function startDraw(e) { if(!ctx) return; drawing = true; const p = getPointer(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }
function draw(e) { if(!ctx || !drawing) return; const p = getPointer(e); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }
function endDraw() { drawing = false; }
function clearCanvas() { if(!ctx) return; ctx.clearRect(0,0,canvas.width,canvas.height); resizeCanvas(); }
function isCanvasBlank() {
  if(!ctx) return true;
  try {
    const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;
    for (let i = 3; i < data.length; i += 4) {
      if (data[i] !== 0) return false;
    }
    return true;
  } catch (e) {
    return false;
  }
}

window.addEventListener('resize', resizeCanvas);
if (canvas) {
  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseout', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw);
  resizeCanvas();
}
qs('#clear-signature') && qs('#clear-signature').addEventListener('click', clearCanvas);

/* ---------- POST fallback: form submitted to hidden iframe ---------- */
function postFallbackForm(url, data = {}) {
  return new Promise((resolve) => {
    const form = document.createElement('form');
    form.style.display = 'none';
    form.method = 'POST';
    form.action = url;
    form.target = 'postFallbackFrame';
    Object.keys(data).forEach(k => {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = k;
      input.value = (typeof data[k] === 'string') ? data[k] : JSON.stringify(data[k]);
      form.appendChild(input);
    });
    document.body.appendChild(form);

    const iframe = qs('#postFallbackFrame');
    const onload = () => {
      iframe.removeEventListener('load', onload);
      setTimeout(() => resolve({ status: 'ok', _fallback: true }), 250);
    };
    iframe.addEventListener('load', onload);

    form.submit();
    // cleanup later
    setTimeout(() => { try { document.body.removeChild(form); } catch(e) {} }, 5000);
  });
}

/* ---------- Polling function: waits for server to mark signed. Uses JSONP safe GETs ---------- */
async function waitSigned(leadId, contractId, tries = 10, delayMs = 1500) {
  for (let i = 0; i < tries; i++) {
    await new Promise(r => setTimeout(r, delayMs));
    try {
      const resp = await jsonp('checkSignatureStatus', { leadId: leadId || '', contractId: contractId || '' }, 10000);
      if (resp && resp.status === 'ok' && resp.signed) return true;
    } catch (e) {
      // ignore and retry
    }
  }
  return false;
}

/* ---------- submitSignature: tries fetch POST (JSON) first, falls back to form-for-iframe ---------- */
async function submitSignature(evt) {
  if (evt && evt.preventDefault) evt.preventDefault();
  const btn = qs('#submit-btn');
  try {
    const params = getParams();
    const leadId = params.get('leadId') || '';
    const contractId = params.get('contractId') || '';

    const signerName = (qs('#signer-name') || {}).value || '';
    const signerEmail = (qs('#signer-email') || {}).value || '';
    const clientLegal = (qs('#clientLegalNameInput') || {}).value || '';

    if (!signerName || !signerEmail || !clientLegal) {
      alert('Please provide full name, email, and legal name before signing.');
      return;
    }
    if (isCanvasBlank()) {
      alert('Please draw your signature before submitting.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Processing...';
    setStatus('Processing signature. Please do not close this page.', 'info');

    const payload = {
      action: 'signContract',
      leadId,
      contractId,
      clientName: signerName,
      clientEmail: signerEmail,
      phone: (qs('#phoneInput') || {}).value || '',
      clientType: (qs('#clientTypeInput') || {}).value || '',
      clientLegalName: clientLegal,
      businessName: (qs('#businessNameInput') || {}).value || '',
      taxIdType: (qs('#taxIdTypeInput') || {}).value || '',
      taxIdNumber: (qs('#taxIdNumberInput') || {}).value || '',
      country: (qs('#countryInput') || {}).value || '',
      address: (qs('#addressInput') || {}).value || '',
      city: (qs('#cityInput') || {}).value || '',
      postalCode: (qs('#postalCodeInput') || {}).value || '',
      packageName: (window.state && window.state.data && window.state.data.packageName) ? window.state.data.packageName : '',
      estimatedPrice: (window.state && window.state.data && window.state.data.estimatedPrice) ? window.state.data.estimatedPrice : '',
      signatureLanguage: (window.state && window.state.lang) ? window.state.lang : 'en',
      signatureData: canvas.toDataURL('image/png'),
      timestamp: new Date().toISOString(),
      userAgent: navigator.userAgent,
      source: location.href
    };

    // Try standard fetch POST with JSON
    let posted = false;
    try {
      const resp = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        credentials: 'omit'
      });
      // If server responds with 200/202 etc, great. Even if non-OK, the body may not be JSON due to CORS; rely on polling.
      if (resp) posted = true;
    } catch (err) {
      posted = false;
    }

    // If fetch failed (likely CORS) then fallback to form+iframe
    if (!posted) {
      try {
        await postFallbackForm(BACKEND_URL, payload);
        posted = true;
      } catch (err) {
        posted = false;
      }
    }

    if (!posted) {
      setStatus('❌ Failed to send signature to server. Possible CORS or network issue.', 'error');
      btn.disabled = false;
      btn.textContent = 'Sign Documents';
      alert('Could not send the signature to the server. Ensure the BACKEND_URL is correct and the Apps Script web app is deployed with access "Anyone, even anonymous".');
      return;
    }

    // Poll the server to confirm it recorded the signature
    const ok = await waitSigned(payload.leadId, payload.contractId, 12, 1500);
    if (ok) {
      setStatus('✅ Documents signed successfully.', 'success');
      btn.textContent = '✅ Documents signed successfully.';
      clearCanvas();
    } else {
      setStatus('❌ Signature submitted but confirmation not received. Please refresh after a few seconds or contact support.', 'error');
      btn.disabled = false;
      btn.textContent = 'Sign Documents';
      alert('Signature was submitted but could not be confirmed. You can try again or contact the site owner.');
    }
  } catch (ex) {
    console.error('submitSignature error', ex);
    setStatus('❌ Unexpected error during submission.', 'error');
    btn.disabled = false;
    btn.textContent = 'Sign Documents';
    alert('An unexpected error occurred. Check the console for details.');
  }
}

/* ---------- Initial load: fetch contract data via JSONP and populate UI ---------- */
async function loadInitialData() {
  try {
    const params = getParams();
    const leadId = params.get('leadId') || '';
    const contractId = params.get('contractId') || '';

    // Example: call backend JSONP to get initial data (your backend action name may differ)
    const resp = await jsonp('getSignatureData', { leadId, contractId }, 15000);
    if (!resp || resp.status !== 'ok') {
      throw new Error((resp && resp.message) ? resp.message : 'Failed to load contract data');
    }

    // Populate UI fields and contract HTML - preserve original keys and markup
    if (resp.data && resp.data.contractHtml) {
      qs('#contract-html').innerHTML = resp.data.contractHtml;
    } else {
      qs('#contract-html').innerHTML = '<p class="text-sm text-slate-600">No contract content available.</p>';
    }

    if (resp.data && resp.data.title) qs('#contract-title').textContent = resp.data.title;
    if (resp.data && resp.data.subtitle) qs('#contract-sub').textContent = resp.data.subtitle;
    // Optionally store state for packageName/price lookups used in payload
    window.state = window.state || {};
    window.state.data = resp.data || {};
    window.state.lang = resp.lang || 'en';

    hide(qs('#loadingBox'));
    show(qs('#app'));
  } catch (e) {
    console.error('loadInitialData error', e);
    hide(qs('#loadingBox'));
    show(qs('#errorBox'));
    qs('#errorText').textContent = e.message || 'Unable to load contract data.';
  }
}

/* Hook up events on DOM ready */
document.addEventListener('DOMContentLoaded', function() {
  const form = qs('#signature-form');
  if (form) form.addEventListener('submit', submitSignature);
  loadInitialData();
});
</script>
</body>
</html>
