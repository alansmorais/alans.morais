<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AlanSM - Sign Contract</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, Arial, sans-serif; background:#f8fafc; }
    #signature-pad { border: 2px dashed #cbd5e1; border-radius: 12px; background: #fff; cursor: crosshair; touch-action: none; }
    .loading-overlay { background: rgba(255,255,255,0.85); z-index: 50; }
    .contract-body { max-height: 520px; overflow:auto; padding:1rem; background:#ffffff; border-radius:8px; border:1px solid #e6eef8; }
    .contract-section { margin-bottom:1rem; }
    .contract-title { font-weight:700; margin-bottom:.5rem; }
    .muted { color:#64748b; font-size:0.92rem; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    pre { white-space:pre-wrap; }
    /* preserve line breaks from spreadsheet cells */
    .preserve-breaks { white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-10 text-slate-800">

  <div id="loader" class="fixed inset-0 loading-overlay flex items-center justify-center">
    <div class="text-center">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
      <p class="mt-2 text-sm font-medium text-slate-600">Loading contract...</p>
    </div>
  </div>

  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-slate-900 text-white p-6 md:p-8">
      <div class="flex justify-between items-center gap-4 mb-2">
        <h1 class="text-2xl font-bold">AlanSM Contract Signature</h1>
        <span id="badge-status" class="bg-amber-500/20 text-amber-300 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30">Pending</span>
      </div>
      <p class="text-slate-400 text-sm">Contract ID: <strong id="display-contract-id">...</strong></p>
    </div>

    <div class="p-6 md:p-8 border-b border-slate-100 bg-slate-50">
      <h2 class="font-bold text-lg mb-4">Contract Summary</h2>
      <div class="grid md:grid-cols-2 gap-4 text-sm">
        <div><p class="text-slate-400 text-xs uppercase font-bold">Client</p><p id="display-name">...</p></div>
        <div><p class="text-slate-400 text-xs uppercase font-bold">Email</p><p id="display-email">...</p></div>
        <div><p class="text-slate-400 text-xs uppercase font-bold">Package</p><p id="display-package" class="preserve-breaks">...</p></div>
        <div><p class="text-slate-400 text-xs uppercase font-bold">Estimated Price</p><p id="display-price" class="preserve-breaks">...</p></div>
      </div>

      <p class="text-xs text-slate-500 mt-5 leading-relaxed">
        Please review the contract below before signing. By signing, you confirm acceptance of the terms.
      </p>
    </div>

    <div class="p-6 md:p-8">
      <div id="contract-container" class="contract-body">
        <!-- contract HTML will be injected here -->
        <div id="contract-content" class="prose"></div>
      </div>
    </div>

    <div class="p-6 md:p-8">
      <form id="signature-form" onsubmit="submitSignature(event)">
        <div class="grid md:grid-cols-2 gap-4 mb-6">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Full Name</label>
            <input type="text" id="signer-name" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Email</label>
            <input type="email" id="signer-email" required class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:border-blue-500" />
          </div>
        </div>

        <div class="mb-4">
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Signature</label>
          <canvas id="signature-pad" class="w-full h-48"></canvas>
          <div class="flex justify-end mt-2">
            <button type="button" id="clear-btn" class="text-xs text-red-500 font-semibold hover:underline">Clear signature</button>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 rounded-xl transition-colors shadow-lg flex justify-center items-center gap-2">
          <span>Sign Document</span>
        </button>

        <div id="status-message" class="text-center text-sm font-medium mt-4 hidden"></div>
      </form>
    </div>
  </div>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    // ---------- CONFIG ----------
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxzYWgEdGsUqjokKIMroI1xmZYE1LQcj4sd8EIoODbDWA5MIxa0xEb85JTuvAQnVMtXA/exec";

    // ---------- estado ----------
    let contractData = null;
    const params = new URLSearchParams(window.location.search);
    const leadId = params.get('leadId');
    const contractId = params.get('contractId') || 'default';

    // ---------- init ----------
    window.addEventListener('DOMContentLoaded', () => {
      if (!leadId) return showError('Invalid link: missing leadId');
      initCanvas();
      loadInitialData();
      document.getElementById('clear-btn').addEventListener('click', clearCanvas);
      window.addEventListener('resize', resizeCanvas);
    });

    function showLoader(show) {
      document.getElementById('loader').style.display = show ? 'flex' : 'none';
    }

    // ---------- JSONP load ----------
    function loadInitialData() {
      showLoader(true);
      const cb = 'cb_' + Date.now();
      const url = `${SCRIPT_URL}?action=getSignatureData&leadId=${encodeURIComponent(leadId)}&contractId=${encodeURIComponent(contractId)}&callback=${cb}`;
      const script = document.createElement('script');
      window[cb] = function(resp) {
        showLoader(false);
        try {
          if (resp && resp.success && resp.data) {
            contractData = resp.data;
            populateUI(contractData);
          } else {
            const err = (resp && resp.error) ? resp.error : 'Contract not found or not available';
            showError(err);
          }
        } catch (err) {
          showError('Invalid response from server');
        }
        script.remove();
        delete window[cb];
      };
      script.onerror = function() {
        showLoader(false);
        showError('Network error: cannot reach backend');
        script.remove();
        delete window[cb];
      };
      script.src = url;
      document.body.appendChild(script);
    }

    // ---------- Render contract into page ----------
    function populateUI(data) {
      // show summary fields
      document.getElementById('display-contract-id').textContent = data.contractId || contractId || '—';
      document.getElementById('display-name').textContent = data.clientLegalName || '—';
      document.getElementById('display-email').textContent = data.clientEmail || '—';
      document.getElementById('display-package').textContent = data.packageName || '—';
      document.getElementById('display-price').textContent = data.estimatedPrice || '—';
      document.getElementById('signer-name').value = data.clientLegalName || '';
      document.getElementById('signer-email').value = data.clientEmail || '';

      // Build contract HTML from template and data
      const filled = fillContractTemplate({
        DATE: formatDate(new Date()),
        LEAD_ID: data.leadId || leadId || '',
        CLIENT_LEGAL_NAME: data.clientLegalName || '',
        TAX_ID: data.taxIdNumber || '',
        ADDRESS: data.address || '',
        POSTAL_CODE: data.postalCode || '',
        CITY: data.city || '',
        EMAIL: data.clientEmail || '',
        PACKAGE: data.packageName || '',
        PRICE: data.estimatedPrice || '',
        CONTRACT_RAW_TEXT: data.contractText || ''
      });

      const container = document.getElementById('contract-content');
      container.innerHTML = filled;
    }

    // Escape user data for safe HTML insertion (do not convert \n -> <br/>; we use CSS pre-wrap)
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Fill the contract template with values (returns safe HTML)
    function fillContractTemplate(vals) {
      // If the spreadsheet stores a "Contract Text/HTML" (already formatted), we prefer to show it.
      if (vals.CONTRACT_RAW_TEXT && String(vals.CONTRACT_RAW_TEXT).trim().length > 10) {
        // sanitize and preserve breaks
        return '<div class="contract-section preserve-breaks">' + escapeHtml(vals.CONTRACT_RAW_TEXT) + '</div>';
      }

      // Otherwise build from the provided standard template (Polish + English)
      const tpl = `
        <div class="contract-section">
          <div class="contract-title">ZAMÓWIENIE USŁUGI / SERVICE ORDER</div>
          <div class="muted">Data: {{DATE}} &nbsp; Numer Projektu: {{LEAD_ID}}</div>
        </div>

        <div class="contract-section">
          <div class="contract-title">WYKONAWCA (SERVICE PROVIDER):</div>
          <pre>AlanSM Solutions - Alan da Silva Morais
Email: kontakt@alansmsolutions.com
PESEL: 87092016359
Kraków, Polska</pre>
        </div>

        <div class="contract-section">
          <div class="contract-title">ZAMAWIAJĄCY (CLIENT):</div>
          <div class="two-col">
            <div>
              <strong>Nazwa firmy (Company Legal Name):</strong><div class="preserve-breaks">{{CLIENT_LEGAL_NAME}}</div>
            </div>
            <div>
              <strong>NIP (Tax ID):</strong><div class="preserve-breaks">{{TAX_ID}}</div>
            </div>
          </div>
          <div style="margin-top:.75rem;">
            <strong>Adres siedziby (Address):</strong><div class="preserve-breaks">{{ADDRESS}}</div>
            <div class="muted preserve-breaks" style="margin-top:.25rem;">Kod pocztowy i miasto (City/Zip): {{POSTAL_CODE}} {{CITY}}</div>
            <div class="muted preserve-breaks" style="margin-top:.25rem;">Email kontaktowy: {{EMAIL}}</div>
          </div>
        </div>

        <div class="contract-section">
          <div class="contract-title">SZCZEGÓŁY ZAMÓWIENIA (PROJECT DETAILS):</div>
          <div><strong>Wybrany Pakiet (Package):</strong></div>
          <div style="margin:0.5rem 0 1rem 0;" class="preserve-breaks">{{PACKAGE}}</div>
          <div><strong>Szacowana Cena (Estimated Price):</strong> <span class="preserve-breaks">{{PRICE}}</span></div>
        </div>

        <div class="contract-section">
          <div class="contract-title">AKCEPTACJA WARUNKÓW (MASTER AGREEMENT)</div>
          <div class="muted">Niniejsze zamówienie podlega pod Ogólne Warunki Świadczenia Usług (Master Service Agreement) AlanSM Solutions. Dokument ten zostanie podpisany elektronicznie, a logi z adresami IP i czasem akceptacji zostaną dołączone do Certyfikatu Podpisu (Signature Audit Proof).</div>
        </div>

        <div class="contract-section">
          <div class="contract-title">OGÓLNE WARUNKI ŚWIADCZENIA USŁUG / MASTER SERVICE AGREEMENT (MSA)</div>

          <div><strong>1. Obowiązki Klienta / Client Responsibilities</strong>
          <div class="muted">[PL] Klient zobowiązuje się do terminowego dostarczania wszelkich niezbędnych materiałów (teksty, logotypy, dostępy do kont) potrzebnych do realizacji projektu. Opóźnienia po stronie Klienta mogą skutkować przesunięciem terminu realizacji.</div>
          <div class="muted">[EN] The Client agrees to provide all necessary materials (texts, logos, account access) required for the project in a timely manner. Delays on the Client's side may result in project deadlines being extended.</div></div>

          <div style="margin-top:.5rem;"><strong>2. Zmiany w Zakresie / Scope Changes</strong>
          <div class="muted">[PL] Projekt obejmuje wyłącznie funkcjonalności określone w Zamówieniu (Szczegóły Zamówienia). Wszelkie dodatkowe poprawki, nowe strony, zaawansowane integracje lub funkcje wykraczające poza ten zakres będą traktowane jako dodatkowa praca i wyceniane osobno.</div>
          <div class="muted">[EN] The project includes only the features specified in the Service Order. Any additional revisions, new pages, advanced integrations, or features outside this scope will be treated as extra work and quoted separately.</div></div>

          <div style="margin-top:.5rem;"><strong>3. Narzędzia Trzecie i Hosting / Third-Party Tools & Hosting</strong>
          <div class="muted">[PL] AlanSM Solutions nie ponosi odpowiedzialności za awarie, zmiany cen, przerwy w działaniu ani błędy oprogramowania firm trzecich (np. hosting, domeny, systemy CRM, bramki płatności, narzędzia do rezerwacji). Koszty subskrypcji tych narzędzi pokrywa Klient.</div>
          <div class="muted">[EN] AlanSM Solutions is not liable for outages, price changes, downtime, or software bugs of third-party providers (e.g., hosting, domains, CRMs, payment gateways, booking tools). The Client is responsible for any third-party subscription costs.</div></div>

          <div style="margin-top:.5rem;"><strong>4. Własność Intelektualna / Intellectual Property</strong>
          <div class="muted">[PL] Po zaksięgowaniu pełnej płatności Klient otrzymuje pełne prawa do korzystania z gotowego systemu/strony oraz własnych treści. AlanSM Solutions zachowuje pełne prawa autorskie do swoich szablonów, kodów źródłowych, skryptów automatyzacji i metodologii (know-how) wykorzystanych do budowy systemu.</div>
          <div class="muted">[EN] Upon full payment, the Client receives full rights to use the final system/website and their own content. AlanSM Solutions retains all copyright and intellectual property rights to its templates, source codes, automation scripts, and methodology (know-how) used to build the system.</div></div>

          <div style="margin-top:.5rem;"><strong>5. Ograniczenie Odpowiedzialności / Limitation of Liability</strong>
          <div class="muted">[PL] AlanSM Solutions dostarcza systemy z najwyższą starannością, jednak nie gwarantuje konkretnych wyników biznesowych, poziomu sprzedaży ani pozycji w wyszukiwarkach. Całkowita odpowiedzialność finansowa AlanSM Solutions z tytułu niniejszej umowy jest ograniczona do kwoty faktycznie zapłaconej przez Klienta za dany projekt.</div>
          <div class="muted">[EN] AlanSM Solutions delivers systems with the utmost care but does not guarantee specific business results, sales volumes, or search engine rankings. The total financial liability of AlanSM Solutions under this agreement is strictly limited to the amount actually paid by the Client for the specific project.</div></div>

          <div style="margin-top:.5rem;"><strong>6. Prawo Właściwe / Governing Law</strong>
          <div class="muted">[PL] Niniejsza umowa podlega prawu polskiemu. Wszelkie spory będą rozstrzygane polubownie, a w przypadku braku porozumienia – przez sąd właściwy dla siedziby AlanSM Solutions.</div>
          <div class="muted">[EN] This agreement shall be governed by Polish law. Any disputes shall be resolved amicably, and failing that, by the court competent for the registered office of AlanSM Solutions.</div></div>
        </div>

        <div class="contract-section">
          <div class="contract-title">AKCEPTACJA / ACCEPTANCE</div>
          <div class="muted">Poprzez akceptację (podpis elektroniczny), Klient potwierdza, że przeczytał, zrozumiał i akceptuje powyższe warunki oraz zgadza się na realizację Zamówienia. / By accepting (electronic signature), the Client confirms that they have read, understood, and accept the above terms and agree to the execution of the Service Order.</div>
        </div>
      `;

      return tpl
        .replace(/{{DATE}}/g, escapeHtml(vals.DATE))
        .replace(/{{LEAD_ID}}/g, escapeHtml(vals.LEAD_ID))
        .replace(/{{CLIENT_LEGAL_NAME}}/g, escapeHtml(vals.CLIENT_LEGAL_NAME))
        .replace(/{{TAX_ID}}/g, escapeHtml(vals.TAX_ID))
        .replace(/{{ADDRESS}}/g, escapeHtml(vals.ADDRESS))
        .replace(/{{POSTAL_CODE}}/g, escapeHtml(vals.POSTAL_CODE))
        .replace(/{{CITY}}/g, escapeHtml(vals.CITY))
        .replace(/{{EMAIL}}/g, escapeHtml(vals.EMAIL))
        .replace(/{{PACKAGE}}/g, escapeHtml(vals.PACKAGE))
        .replace(/{{PRICE}}/g, escapeHtml(vals.PRICE));
    }

    // ---------- format date dd/MM/yyyy ----------
    function formatDate(d) {
      const dd = String(d.getDate()).padStart(2,'0');
      const mm = String(d.getMonth()+1).padStart(2,'0');
      const yyyy = d.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }

    function showError(msg) {
      showLoader(false);
      const status = document.getElementById('status-message');
      status.classList.remove('hidden');
      status.classList.remove('text-green-600');
      status.classList.add('text-red-600');
      status.textContent = '❌ ' + msg;
      document.getElementById('submit-btn').disabled = true;
    }

    // ---------- Canvas / Signature ----------
    const canvas = document.getElementById('signature-pad');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function initCanvas() {
      resizeCanvas();
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0f172a';

      canvas.addEventListener('mousedown', (e) => { drawing = true; const p = pointerPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
      canvas.addEventListener('mousemove', (e) => { if (!drawing) return; const p = pointerPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
      window.addEventListener('mouseup', () => drawing = false);
      canvas.addEventListener('touchstart', (e) => { drawing = true; const p = pointerPos(e.touches[0]); ctx.beginPath(); ctx.moveTo(p.x, p.y); e.preventDefault(); }, {passive:false});
      canvas.addEventListener('touchmove', (e) => { if (!drawing) return; const p = pointerPos(e.touches[0]); ctx.lineTo(p.x, p.y); ctx.stroke(); e.preventDefault(); }, {passive:false});
    }

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const w = canvas.offsetWidth;
      const h = canvas.offsetHeight;
      canvas.width = Math.round(w * ratio);
      canvas.height = Math.round(h * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      // do not clear on resize if there is content — keep existing drawing scaled correctly is hard;
      // we clear to avoid blurry artifacts and ask user to re-sign if they resize mid-sign
      clearCanvas();
    }

    function pointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || 0) - rect.left;
      const y = (e.clientY || 0) - rect.top;
      return { x, y };
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // ---------- submit signature ----------
    async function submitSignature(ev) {
      ev && ev.preventDefault();
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('status-message');
      status.classList.remove('text-red-600'); status.classList.remove('text-green-600');
      status.classList.add('text-slate-600'); status.classList.remove('hidden');
      status.textContent = 'Sending...';
      btn.disabled = true;

      const payload = {
        action: 'signContract',
        leadId: leadId,
        contractId: contractId,
        signatureData: canvas.toDataURL('image/png'),
        clientName: document.getElementById('signer-name').value,
        clientEmail: document.getElementById('signer-email').value,
        timestamp: new Date().toISOString()
      };

      // Try normal POST (best)
      try {
        const resp = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          credentials: 'omit'
        });

        if (!resp.ok) {
          throw new Error('HTTP ' + resp.status);
        }
        const json = await resp.json();
        if (json && json.success) {
          status.classList.remove('text-slate-600');
          status.classList.add('text-green-600');
          status.textContent = '✅ Signed successfully';
          btn.innerText = 'Signed';
          btn.disabled = true;
          return;
        } else {
          throw new Error((json && json.error) ? json.error : 'Server rejected signature');
        }
      } catch (err) {
        // Fallback: form POST to hidden iframe (works around some CORS/firewalls)
        console.warn('Primary POST failed, attempting iframe fallback: ', err && err.message);
        try {
          iframeFormPost(payload);
          // optimistic UI
          setTimeout(function() {
            status.classList.remove('text-slate-600');
            status.classList.add('text-green-600');
            status.textContent = '✅ Signed (fallback)';
            btn.innerText = 'Signed';
            btn.disabled = true;
          }, 2000);
        } catch (e2) {
          status.classList.remove('text-slate-600');
          status.classList.add('text-red-600');
          status.textContent = 'Failed to send signature: ' + (e2.message || e2);
          btn.disabled = false;
        }
      }
    }

    // ---------- iframe form fallback ----------
    function iframeFormPost(payload) {
      const form = document.createElement('form');
      form.action = SCRIPT_URL;
      form.method = 'POST';
      form.target = 'hidden_iframe';
      form.style.display = 'none';
      // add fields (stringify large fields)
      Object.keys(payload).forEach(k => {
        const inp = document.createElement('input'); inp.type = 'hidden'; inp.name = k; inp.value = payload[k];
        form.appendChild(inp);
      });
      document.body.appendChild(form);
      form.submit();
      setTimeout(() => form.remove(), 4000);
      return true;
    }
  </script>
</body>
</html>
